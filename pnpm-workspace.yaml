packages:
  - "packages/**"

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.142'
  - '@ai-sdk/openai-compatible@3.0.90'
  - '@ai-sdk/provider-utils@5.0.79'
  - ai@7.0.169

overrides:
  next: 15.5.28
  sharp: 0.35.5
