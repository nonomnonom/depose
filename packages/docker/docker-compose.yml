services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: depose
      POSTGRES_PASSWORD: depose
      POSTGRES_DB: depose
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depose"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../../
      dockerfile: packages/docker/Dockerfile.server
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-depose}:${POSTGRES_PASSWORD:-depose}@db:5432/${POSTGRES_DB:-depose}
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/migrate.js"]
    restart: "no"

  server:
    build:
      context: ../../
      dockerfile: packages/docker/Dockerfile.server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${SERVER_PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-depose}:${POSTGRES_PASSWORD:-depose}@db:5432/${POSTGRES_DB:-depose}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      WORKER_ENABLED: "false"
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /data/storage
    env_file:
      - .env
    volumes:
      - storage-data:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"

  worker:
    build:
      context: ../../
      dockerfile: packages/docker/Dockerfile.server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-depose}:${POSTGRES_PASSWORD:-depose}@db:5432/${POSTGRES_DB:-depose}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      WORKER_ENABLED: "true"
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /data/storage
    env_file:
      - .env
    volumes:
      - storage-data:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/worker.main.js"]
    # The image healthcheck probes the HTTP API, which the worker does not serve.
    healthcheck:
      disable: true

  frontend:
    build:
      context: ../../
      dockerfile: packages/docker/Dockerfile.frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
    depends_on:
      - server
    ports:
      - "${FRONTEND_PORT:-4173}:${FRONTEND_PORT:-4173}"

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  storage-data:
