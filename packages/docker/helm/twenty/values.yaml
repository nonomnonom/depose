# Default values for Depose Helm chart.
# This is a starter values file modeled after Twenty's chart shape.
# Customize this for your cluster, ingress, storage, and secrets.

replicaCount: 1

server:
  image:
    repository: depose/server
    tag: latest
    pullPolicy: IfNotPresent
  env:
    NODE_ENV: production
    DATABASE_URL: postgresql://depose:changethis@db-service:5432/depose
    REDIS_HOST: redis-service
    REDIS_PORT: "6379"
  extraEnvFrom: []
  port: 3000
  resources: {}
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: depose.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    # - hosts:
    #     - depose.example.com
    #   secretName: depose-tls

worker:
  enabled: true
  image:
    repository: depose/server
    tag: latest
    pullPolicy: IfNotPresent
  env:
    NODE_ENV: production
    DATABASE_URL: postgresql://depose:changethis@db-service:5432/depose
    REDIS_HOST: redis-service
    REDIS_PORT: "6379"
  resources: {}

db:
  enabled: true
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  auth:
    username: depose
    password: changethis
    database: depose
  storage:
    enabled: true
    size: 1Gi
  port: 5432

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  storage:
    enabled: true
    size: 512Mi
  port: 6379

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: depose.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
